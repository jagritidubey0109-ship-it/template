<body class="bg-[#09050d] text-[#f7e7ce]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ============================================================================
    // 1. AUDIO ENGINE (DIRECT CHROME MP3 PLAYBACK + BAROQUE FALLBACK + VISUALIZER)
    // ============================================================================
    class RomanticAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.analyser = null;
        this.dataArray = null;
        this.isPlaying = false;
        this.volume = 0.72;
        this.isMuted = false;
        this.mode = 'file';
        this.audioEl = null;
        this.hasCustomFile = false;

        this.duration = 207;
        this.elapsed = 0;
        this.stepIndex = 0;
        this.schedulerTimer = null;
        this.clockTimer = null;
        this.nextNoteTime = 0;

        this.measures = [
          {
            bass: 92.50,
            notes: [185.00, 220.00, 277.18, 220.00, 329.63, 277.18, 369.99, 329.63, 277.18, 415.30, 369.99, 329.63, 277.18],
            pad: [185.00, 220.00, 277.18, 329.63]
          },
          {
            bass: 123.47,
            notes: [246.94, 293.66, 369.99, 293.66, 440.00, 369.99, 493.88, 440.00, 369.99, 440.00, 369.99, 329.63, 293.66],
            pad: [246.94, 293.66, 369.99, 440.00]
          },
          {
            bass: 82.41,
            notes: [164.81, 207.65, 246.94, 207.65, 329.63, 246.94, 369.99, 329.63, 246.94, 415.30, 369.99, 329.63, 246.94],
            pad: [164.81, 207.65, 246.94, 369.99]
          },
          {
            bass: 110.00,
            notes: [220.00, 277.18, 329.63, 277.18, 415.30, 329.63, 440.00, 415.30, 329.63, 493.88, 440.00, 329.63, 277.18],
            pad: [220.00, 277.18, 329.63, 415.30]
          },
          {
            bass: 73.42,
            notes: [146.83, 220.00, 277.18, 220.00, 329.63, 277.18, 369.99, 329.63, 277.18, 329.63, 277.18, 220.00, 185.00],
            pad: [146.83, 220.00, 277.18, 369.99]
          },
          {
            bass: 69.30,
            notes: [138.59, 207.65, 277.18, 207.65, 311.13, 277.18, 369.99, 311.13, 277.18, 311.13, 277.18, 246.94, 207.65],
            pad: [138.59, 207.65, 246.94, 311.13]
          }
        ];
        this.measureIdx = 0;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
          this.masterGain = this.ctx.createGain();
          const safeVol = Number.isFinite(this.volume) ? this.volume : 0.72;
          this.masterGain.gain.value = this.isMuted ? 0 : safeVol;

          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 64;
          this.analyser.smoothingTimeConstant = 0.82;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.masterGain.connect(this.analyser);
          this.analyser.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playHarpsichordNote(freq, time, duration, velocity = 0.16) {
        if (!this.ctx || !this.masterGain) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const noteGain = this.ctx.createGain();

        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, time);

        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(freq * 2.001, time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3200, time);
        filter.frequency.exponentialRampToValueAtTime(650, time + duration);

        noteGain.gain.setValueAtTime(0.0001, time);
        noteGain.gain.linearRampToValueAtTime(velocity, time + 0.012);
        noteGain.gain.exponentialRampToValueAtTime(0.0008, time + duration);

        const osc2Gain = this.ctx.createGain();
        osc2Gain.gain.value = 0.28;

        osc1.connect(filter);
        osc2.connect(osc2Gain);
        osc2Gain.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(this.masterGain);

        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + duration + 0.05);
        osc2.stop(time + duration + 0.05);
      }

      playVelvetPad(freqs, bassFreq, time, duration) {
        if (!this.ctx || !this.masterGain) return;
        const bassOsc = this.ctx.createOscillator();
        const bassGain = this.ctx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(bassFreq, time);
        bassGain.gain.setValueAtTime(0.0001, time);
        bassGain.gain.linearRampToValueAtTime(0.18, time + 0.18);
        bassGain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        bassOsc.connect(bassGain);
        bassGain.connect(this.masterGain);
        bassOsc.start(time);
        bassOsc.stop(time + duration + 0.1);

        freqs.forEach((f) => {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const padGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, time);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(900, time);
          padGain.gain.setValueAtTime(0.0001, time);
          padGain.gain.linearRampToValueAtTime(0.055, time + 0.35);
          padGain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
          osc.connect(filter);
          filter.connect(padGain);
          padGain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + duration + 0.1);
        });
      }

      scheduleSynth() {
        if (!this.isPlaying || this.mode !== 'synth' || !this.ctx) return;
        const eighthDur = 0.245;
        while (this.nextNoteTime < this.ctx.currentTime + 0.18) {
          const measure = this.measures[this.measureIdx];
          if (this.stepIndex === 0) {
            this.playVelvetPad(measure.pad, measure.bass, this.nextNoteTime, eighthDur * 13);
          }
          const noteFreq = measure.notes[this.stepIndex];
          const accent = [0, 3, 6, 9].includes(this.stepIndex) ? 0.17 : 0.11;
          this.playHarpsichordNote(noteFreq, this.nextNoteTime, eighthDur * 1.45, accent);
          this.nextNoteTime += eighthDur;
          this.stepIndex++;
          if (this.stepIndex >= 13) {
            this.stepIndex = 0;
            this.measureIdx = (this.measureIdx + 1) % this.measures.length;
          }
        }
      }

      playHeartbeatChime() {
        this.initContext();
        if (!this.ctx || !this.masterGain) return;
        const now = this.ctx.currentTime;
        const thump = (offset, freq, gainPeak) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + offset);
          osc.frequency.exponentialRampToValueAtTime(42, now + offset + 0.16);
          g.gain.setValueAtTime(0.0001, now + offset);
          g.gain.linearRampToValueAtTime(gainPeak, now + offset + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0008, now + offset + 0.22);
          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(now + offset);
          osc.stop(now + offset + 0.25);
        };
        thump(0, 115, 0.36);
        thump(0.18, 95, 0.28);

        const chime = this.ctx.createOscillator();
        const cg = this.ctx.createGain();
        chime.type = 'triangle';
        chime.frequency.setValueAtTime(880, now + 0.02);
        chime.frequency.exponentialRampToValueAtTime(1318.5, now + 0.28);
        cg.gain.setValueAtTime(0.0001, now + 0.02);
        cg.gain.linearRampToValueAtTime(0.09, now + 0.05);
        cg.gain.exponentialRampToValueAtTime(0.0005, now + 0.55);
        chime.connect(cg);
        cg.connect(this.masterGain);
        chime.start(now + 0.02);
        chime.stop(now + 0.6);
      }

      initLocalAudio(defaultSrc = './Golden_Brown.mp3') {
        if (this.audioEl || typeof window === 'undefined') return;
        const candidates = [
          defaultSrc,
          './Golden Brown.mp3',
          './golden_brown.mp3',
          './golden-brown.mp3',
          './Golden_Brown (1).mp3'
        ];
        let idx = 0;

        this.audioEl = new Audio();
        this.audioEl.src = candidates[idx];
        this.audioEl.loop = true;
        this.audioEl.preload = 'auto';
        this.audioEl.volume = this.isMuted ? 0 : this.volume;

        this.audioEl.onloadedmetadata = () => {
          if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
            this.duration = this.audioEl.duration;
          }
          this.mode = 'file';
        };

        this.audioEl.onerror = () => {
          if (this.hasCustomFile) return;
          idx++;
          if (idx < candidates.length) {
            this.audioEl.src = candidates[idx];
            this.audioEl.load();
          } else {
            this.mode = 'synth';
          }
        };
      }

      start() {
        this.initContext();
        if (this.isPlaying) return;
        this.isPlaying = true;

        this.initLocalAudio('./Golden_Brown.mp3');

        if (this.mode === 'file' && this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
          const p = this.audioEl.play();
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              this.mode = 'synth';
              this.nextNoteTime = this.ctx.currentTime + 0.05;
              this.schedulerTimer = setInterval(() => this.scheduleSynth(), 50);
            });
          }
        } else {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
          this.schedulerTimer = setInterval(() => this.scheduleSynth(), 50);
        }

        if (this.clockTimer) clearInterval(this.clockTimer);
        this.clockTimer = setInterval(() => {
          if (!this.isPlaying) return;
          if (this.mode === 'file' && this.audioEl) {
            this.elapsed = this.audioEl.currentTime || 0;
            if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
              this.duration = this.audioEl.duration;
            }
          } else {
            this.elapsed += 0.25;
            if (this.elapsed >= this.duration) {
              this.elapsed = 0;
            }
          }
        }, 250);
      }

      pause() {
        this.isPlaying = false;
        if (this.schedulerTimer) clearInterval(this.schedulerTimer);
        if (this.clockTimer) clearInterval(this.clockTimer);
        if (this.mode === 'file' && this.audioEl) {
          this.audioEl.pause();
        }
      }

      toggle() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.start();
        }
        return this.isPlaying;
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
        }
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.04);
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
        }
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.04);
        }
        return this.isMuted;
      }

      loadCustomFile(file, onLoaded) {
        if (this.schedulerTimer) clearInterval(this.schedulerTimer);

        const url = URL.createObjectURL(file);
        if (!this.audioEl) {
          this.audioEl = new Audio();
          this.audioEl.loop = true;
          this.audioEl.preload = 'auto';
        }

        this.hasCustomFile = true;
        this.audioEl.pause();
        this.audioEl.src = url;
        this.audioEl.load();
        this.audioEl.volume = this.isMuted ? 0 : this.volume;
        this.mode = 'file';
        this.elapsed = 0;

        this.audioEl.onloadedmetadata = () => {
          if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
            this.duration = this.audioEl.duration;
          }
          if (onLoaded) onLoaded(file.name, this.duration);
        };

        this.isPlaying = true;
        const playPromise = this.audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            this.isPlaying = false;
          });
        }

        if (this.clockTimer) clearInterval(this.clockTimer);
        this.clockTimer = setInterval(() => {
          if (this.isPlaying && this.mode === 'file' && this.audioEl) {
            this.elapsed = this.audioEl.currentTime || 0;
            if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
              this.duration = this.audioEl.duration;
            }
          }
        }, 250);
      }

      getFrequencyBars(count = 16) {
        if (!this.isPlaying) {
          return new Array(count).fill(0.08);
        }
        if (this.mode === 'file' || !this.analyser || !this.dataArray) {
          const t = performance.now() / 180;
          const bars = [];
          for (let i = 0; i < count; i++) {
            const wave = 0.25 + 0.55 * Math.abs(Math.sin(t + i * 0.55) * Math.cos(t * 0.7 - i * 0.3));
            bars.push(wave);
          }
          return bars;
        }
        this.analyser.getByteFrequencyData(this.dataArray);
        const bars = [];
        for (let i = 0; i < count; i++) {
          const idx = Math.floor((i / count) * (this.dataArray.length * 0.75));
          const val = (this.dataArray[idx] || 0) / 255;
          bars.push(Math.max(0.1, val));
        }
        return bars;
      }
    }

    // ============================================================================
    // 2. THREE.JS PROCEDURAL 3D SCENE & SCULPTURE ENGINE (MOBILE FIXED)
    // ============================================================================
    function ThreeExperienceCanvas({
      sceneIndex,
      envelopeOpening,
      heartPulseTrigger,
      onEnvelopeOpened,
      onTriggerOpenEnvelope
    }) {
      const mountRef = useRef(null);
      const stateRef = useRef({
        sceneIndex,
        envelopeOpening,
        openProgress: 0,
        hasTriggeredCallback: false,
        heartPulseTime: -10,
        lastPulseId: 0,
        mouseX: 0,
        mouseY: 0,
        targetMouseX: 0,
        targetMouseY: 0
      });

      useEffect(() => {
        stateRef.current.sceneIndex = sceneIndex;
        if (sceneIndex === 0 && !envelopeOpening) {
          stateRef.current.openProgress = 0;
          stateRef.current.hasTriggeredCallback = false;
        }
      }, [sceneIndex, envelopeOpening]);

      useEffect(() => {
        stateRef.current.envelopeOpening = envelopeOpening;
      }, [envelopeOpening]);

      useEffect(() => {
        if (heartPulseTrigger > 0 && heartPulseTrigger !== stateRef.current.lastPulseId) {
          stateRef.current.lastPulseId = heartPulseTrigger;
          stateRef.current.heartPulseTime = performance.now() / 1000;
        }
      }, [heartPulseTrigger]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container || !window.THREE) return;
        const THREE = window.THREE;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x14040a, 0.028);

        const camera = new THREE.PerspectiveCamera(
          45,
          container.clientWidth / container.clientHeight,
          0.1,
          120
        );
        camera.position.set(0, 0.4, 9.5);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        // MOBILE FIX: Safe pixel ratio capping to prevent GPU crash on phones
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffe6eb, 0.65);
        scene.add(ambientLight);

        const keyLight = new THREE.PointLight(0xffd78a, 2.2, 35);
        keyLight.position.set(4.5, 5.5, 6.5);
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0xff6b9d, 1.8, 30);
        rimLight.position.set(-5.5, 3.0, -4.0);
        scene.add(rimLight);

        const lavenderFill = new THREE.PointLight(0xc3b1e1, 1.3, 30);
        lavenderFill.position.set(0, -4.5, 5.0);
        scene.add(lavenderFill);

        function createHeartGeometry(scale = 1, depth = 0.35) {
          const shape = new THREE.Shape();
          const x = 0, y = 0;
          shape.moveTo(x, y + 0.35 * scale);
          shape.bezierCurveTo(x, y + 0.35 * scale, x - 0.05 * scale, y, x - 0.35 * scale, y);
          shape.bezierCurveTo(x - 0.85 * scale, y, x - 0.85 * scale, y + 0.62 * scale, x - 0.85 * scale, y + 0.62 * scale);
          shape.bezierCurveTo(x - 0.85 * scale, y + 0.95 * scale, x - 0.52 * scale, y + 1.32 * scale, x, y + 1.65 * scale);
          shape.bezierCurveTo(x + 0.52 * scale, y + 1.32 * scale, x + 0.85 * scale, y + 0.95 * scale, x + 0.85 * scale, y + 0.62 * scale);
          shape.bezierCurveTo(x + 0.85 * scale, y + 0.62 * scale, x + 0.85 * scale, y, x + 0.35 * scale, y);
          shape.bezierCurveTo(x + 0.12 * scale, y, x, y + 0.35 * scale, x, y + 0.35 * scale);

          const geom = new THREE.ExtrudeGeometry(shape, {
            depth: depth * scale,
            bevelEnabled: true,
            bevelSegments: 8,
            steps: 2,
            bevelSize: 0.12 * scale,
            bevelThickness: 0.12 * scale
          });
          geom.center();
          geom.rotateZ(Math.PI);
          return geom;
        }

        function createWaxSealTexture() {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');

          const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
          grad.addColorStop(0, '#fff2c6');
          grad.addColorStop(0.55, '#d4af37');
          grad.addColorStop(0.88, '#9e781c');
          grad.addColorStop(1, '#6e4f0c');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 512, 512);

          ctx.strokeStyle = '#fff5d6';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(256, 256, 205, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#7c5910';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(256, 256, 192, 0, Math.PI * 2);
          ctx.stroke();

          for (let i = 0; i < 24; i++) {
            const angle = (i / 24) * Math.PI * 2;
            const rx = 256 + Math.cos(angle) * 172;
            const ry = 256 + Math.sin(angle) * 172;
            ctx.fillStyle = '#fff3cc';
            ctx.beginPath();
            ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.font = 'bold 215px Georgia, serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillStyle = '#5e4107';
          ctx.fillText('V', 260, 272);

          ctx.fillStyle = '#fff6d6';
          ctx.fillText('V', 254, 266);

          return new THREE.CanvasTexture(canvas);
        }

        const ambientGroup = new THREE.Group();
        scene.add(ambientGroup);

        const dustCount = 280;
        const dustGeom = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustSpeeds = [];
        for (let i = 0; i < dustCount; i++) {
          dustPos[i * 3] = (Math.random() - 0.5) * 24;
          dustPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
          dustPos[i * 3 + 2] = (Math.random() - 0.5) * 16 - 2;
          dustSpeeds.push(0.003 + Math.random() * 0.007);
        }
        dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({
          color: 0xf7e7ce,
          size: 0.08,
          transparent: true,
          opacity: 0.78,
          blending: THREE.AdditiveBlending
        });
        const dustPoints = new THREE.Points(dustGeom, dustMat);
        ambientGroup.add(dustPoints);

        const petalShape = new THREE.Shape();
        petalShape.moveTo(0, 0);
        petalShape.bezierCurveTo(0.14, 0.14, 0.18, 0.34, 0, 0.44);
        petalShape.bezierCurveTo(-0.18, 0.34, -0.14, 0.14, 0, 0);
        const petalGeom = new THREE.ShapeGeometry(petalShape);
        const miniHeartGeom = createHeartGeometry(0.14, 0.05);

        const floaters = [];
        const petalColors = [0x8b1538, 0xc92a55, 0xf4c2c2, 0xff8da1, 0xd4af37];
        for (let i = 0; i < 32; i++) {
          const isHeart = i % 4 === 0;
          const mat = new THREE.MeshStandardMaterial({
            color: petalColors[i % petalColors.length],
            emissive: isHeart ? 0x5c1028 : 0x22040c,
            emissiveIntensity: 0.45,
            roughness: 0.35,
            metalness: 0.25,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
          });
          const mesh = new THREE.Mesh(isHeart ? miniHeartGeom : petalGeom, mat);
          mesh.position.set(
            (Math.random() - 0.5) * 18,
            (Math.random() - 0.5) * 14,
            (Math.random() - 0.5) * 10 - 2
          );
          mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          const scale = 0.65 + Math.random() * 0.75;
          mesh.scale.setScalar(scale);
          ambientGroup.add(mesh);
          floaters.push({
            mesh,
            vy: 0.006 + Math.random() * 0.01,
            vx: (Math.random() - 0.5) * 0.008,

    // ============================================================================
    // 3B. CINEMATIC 10-SECOND LOOPING COSMIC COUPLE ANIMATION
    // ============================================================================
    function OurUniverseAnimatedScene({ isInfinity }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const resize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          canvas.width = parent.clientWidth;
          canvas.height = parent.clientHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const pathStars = Array.from({ length: 120 }, (_, i) => ({
          u: Math.random(),
          spread: (Math.random() - 0.5) * 2,
          size: 1 + Math.random() * 2,
          twinkle: Math.random() * Math.PI * 2,
          speed: 0.14 + (i % 5) * 0.03
        }));

        const startTime = performance.now();

        const render = (now) => {
          animId = requestAnimationFrame(render);
          const w = canvas.width;
          const h = canvas.height;
          const t = (now - startTime) / 1000;

          const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, '#0d061a');
          skyGrad.addColorStop(0.5, '#2b1038');
          skyGrad.addColorStop(1, '#1a0814');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);

          const horizonY = h * 0.66;
          pathStars.forEach((ps) => {
            const prog = (ps.u + t * ps.speed) % 1;
            const py = horizonY + Math.pow(prog, 1.45) * (h - horizonY);
            const halfWidth = (0.04 + Math.pow(prog, 1.35) * 0.48) * w;
            const px = w * 0.5 + ps.spread * halfWidth;
            ctx.fillStyle = 'rgba(255, 232, 163, 0.8)';
            ctx.beginPath();
            ctx.arc(px, py, ps.size, 0, Math.PI * 2);
            ctx.fill();
          });
        };

        animId = requestAnimationFrame(render);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
        };
      }, [isInfinity]);

      return <canvas ref={canvasRef} className="w-full h-full block" />;
    }

      useEffect(() => {
        if (audioEngineRef.current) {
          audioEngineRef.current.initLocalAudio('./Golden_Brown.mp3');
        }
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          const engine = audioEngineRef.current;
          if (!engine) return;
          setIsPlaying(engine.isPlaying);
          setTrackTime({ elapsed: engine.elapsed, duration: engine.duration });
          setVizBars(engine.getFrequencyBars(12));
        }, 100);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (sceneIdx !== 1) {
          setLetterVisibleLines(0);
          return;
        }
        setLetterVisibleLines(1);
        const timers = LOVE_LETTER_LINES.map((_, idx) =>
          setTimeout(() => {
            setLetterVisibleLines(idx + 1);
          }, (idx + 1) * 600)
        );
        return () => timers.forEach(clearTimeout);
      }, [sceneIdx]);

      useEffect(() => {
        if (sceneIdx !== 14) {
          setVisibleLittleCards(0);
          return;
        }
        setVisibleLittleCards(1);
        const timers = LITTLE_THINGS_CARDS.map((_, idx) =>
          setTimeout(() => {
            setVisibleLittleCards(idx + 1);
          }, (idx + 1) * 600)
        );
        return () => timers.forEach(clearTimeout);
      }, [sceneIdx]);

      useEffect(() => {
        if (sceneIdx !== 16) {
          setVisibleLastLines(0);
          return;
        }
        setVisibleLastLines(1);
        const timers = [0, 1, 2, 3, 4, 5].map((step) =>
          setTimeout(() => {
            setVisibleLastLines(step + 1);
          }, (step + 1) * 800)
        );
        return () => timers.forEach(clearTimeout);
      }, [sceneIdx]);

      const triggerOpenEnvelope = useCallback(() => {
        if (envelopeOpening) return;
        setEnvelopeOpening(true);
        if (audioEngineRef.current && !audioEngineRef.current.isPlaying) {
          audioEngineRef.current.start();
          setIsPlaying(true);
        }
      }, [envelopeOpening]);

      const handleEnvelopeOpened = useCallback(() => {
        setSceneIdx(1);
      }, []);

      const handleNext = () => {
        if (sceneIdx === 0) {
          triggerOpenEnvelope();
          return;
        }
        if (sceneIdx < STORY_SCENES.length - 1) {
          setSceneIdx((prev) => prev + 1);
        }
      };

      const handlePrev = () => {
        if (sceneIdx > 0) {
          if (sceneIdx === 1) {
            setEnvelopeOpening(false);
          }
          setSceneIdx((prev) => prev - 1);
        }
      };

      const handleReplay = () => {
        setEnvelopeOpening(false);
        setLetterVisibleLines(0);
        setHeartBeatCount(0);
        setHeartPulseTrigger(0);
        setUniverseInfinityMode(false);
        setVisibleLittleCards(0);
        setOpenedPromiseIds([]);
        setActivePromiseModal(null);
        setVisibleLastLines(0);
        setSceneIdx(0);
      };

      const handleOpenPromiseNote = (note) => {
        setActivePromiseModal(note);
        setOpenedPromiseIds((prev) => (prev.includes(note.id) ? prev : [...prev, note.id]));
      };

      const handleUniverseVideoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        setCustomUniverseVideoUrl(url);
      };

      const handlePumpHeart = () => {
        setHeartBeatCount((prev) => prev + 1);
        setHeartPulseTrigger((prev) => prev + 1);
        if (audioEngineRef.current) {
          audioEngineRef.current.playHeartbeatChime();
        }
      };

      const handleTogglePlay = () => {
        const playing = audioEngineRef.current.toggle();
        setIsPlaying(playing);
      };

      const formatTime = (sec) => {
        const s = Math.floor(sec || 0);
        const mins = Math.floor(s / 60);
        const rem = s % 60;
        return `${mins}:${rem < 10 ? '0' : ''}${rem}`;
      };

      const currentScene = STORY_SCENES[sceneIdx];

      return (
        <div className="relative w-full min-h-[100dvh] flex flex-col justify-between overflow-x-hidden select-none text-[#f7e7ce] bg-[#09050d]">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

            .font-editorial { font-family: 'Cormorant Garamond', Georgia, serif; }
            .font-handwritten { font-family: 'Alex Brush', cursive; }
            .font-ui { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

            .velvet-backdrop {
              background: radial-gradient(circle at 50% 35%, rgba(74, 14, 30, 0.58) 0%, rgba(25, 6, 14, 0.85) 52%, #09050d 100%);
            }

            .glass-luxury {
              background: linear-gradient(145deg, rgba(43, 5, 16, 0.82), rgba(14, 6, 16, 0.92));
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
              border: 1px solid rgba(212, 175, 55, 0.38);
              box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            }

            .parchment-sheet {
              background: radial-gradient(circle at top left, rgba(255, 250, 240, 0.98), rgba(247, 231, 206, 0.96) 60%, rgba(235, 211, 175, 0.96) 100%);
              box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.3);
              border: 1px solid rgba(212, 175, 55, 0.7);
            }

            @keyframes goldShimmer {
              0% { background-position: 0% 50%; }
              50% { background-position: 100% 50%; }
              100% { background-position: 0% 50%; }
            }

            .gold-cta-btn {
              background: linear-gradient(120deg, #b88924, #f5dca0, #d4af37, #9e7216);
              background-size: 220% 220%;
              animation: goldShimmer 4.5s ease infinite;
              box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
            }

            .animate-scene-enter { animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
            @keyframes fadeSlideUp {
              from { opacity: 0; transform: translateY(12px); }
              to { opacity: 1; transform: translateY(0); }
            }
          `}</style>

          <div className="fixed inset-0 velvet-backdrop pointer-events-none z-0" />

          <ThreeExperienceCanvas
            sceneIndex={sceneIdx}
            envelopeOpening={envelopeOpening}
            heartPulseTrigger={heartPulseTrigger}
            onEnvelopeOpened={handleEnvelopeOpened}
            onTriggerOpenEnvelope={triggerOpenEnvelope}
          />

          {/* TOP CONTROLS */}
          <header className="relative z-20 w-full px-3 pt-3 sm:px-6 sm:pt-4 flex flex-col sm:flex-row items-center justify-between gap-2.5 pointer-events-none">
            <div className="glass-luxury pointer-events-auto px-3.5 py-1.5 rounded-full flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-[#d4af37] animate-pulse" />
              <span className="font-ui text-[11px] sm:text-xs tracking-[0.18em] uppercase text-[#f4c2c2] font-medium truncate max-w-[240px]">
                {currentScene.badge}
              </span>
            </div>

            <div className="glass-luxury pointer-events-auto px-3 py-1.5 rounded-2xl sm:rounded-full flex items-center gap-2.5 max-w-full">
              <button
                onClick={handleTogglePlay}
                className="w-8 h-8 rounded-full flex items-center justify-center bg-gradient-to-br from-[#d4af37] to-[#8c6414] text-[#14040a] shadow shrink-0 active:scale-95 transition"
                aria-label="Play/Pause Music"
              >
                {isPlaying ? (
                  <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
                ) : (
                  <svg className="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" /></svg>
                )}
              </button>

              <div className="flex flex-col min-w-[105px] max-w-[145px]">
                <span className="font-ui text-[11px] font-semibold text-[#f7e7ce] truncate">{trackTitle}</span>
                <span className="font-ui text-[9px] text-[#c3b1e1]">{formatTime(trackTime.elapsed)} / {formatTime(trackTime.duration)}</span>
              </div>

              <button
                onClick={() => fileInputRef.current?.click()}
                className="font-ui text-[10px] px-2.5 py-1 rounded-full bg-[#d4af37]/20 border border-[#d4af37]/60 text-[#ffd78a] shrink-0"
              >
                Song
              </button>
              <input ref={fileInputRef} type="file" accept="audio/*" onChange={(e) => {
                const file = e.target.files?.[0];
                if (file) audioEngineRef.current.loadCustomFile(file, (name, dur) => {
                  setTrackTitle(name.replace(/\.[^/.]+$/, ''));
                  setTrackTime({ elapsed: 0, duration: dur });
                  setIsPlaying(true);
                });
              }} className="hidden" />
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-3 py-2 pointer-events-none my-auto">
            {sceneIdx === 0 && (
              <div className="w-full flex-1 flex flex-col items-center justify-between py-4 animate-scene-enter">
                <div className="text-center mt-2 px-2">
                  <h1 className="font-editorial text-3xl sm:text-5xl font-semibold text-[#f7e7ce] drop-shadow-lg">
                    A Sealed Keepsake for <span className="italic text-[#ff8da1]">Vivek</span>
                  </h1>
                  <p className="font-ui text-[11px] sm:text-xs text-[#c3b1e1] mt-1.5 tracking-widest uppercase">
                    Sealed in gold • Crafted with love
                  </p>
                </div>

                <div className="mb-4 pointer-events-auto flex flex-col items-center gap-2">
                  <button
                    onClick={triggerOpenEnvelope}
                    disabled={envelopeOpening}
                    className="gold-cta-btn px-7 py-3.5 rounded-full font-editorial text-lg sm:text-2xl font-bold text-[#1a050b] active:scale-95 transition-transform cursor-pointer shadow-lg"
                  >
                    {envelopeOpening ? 'Unsealing Your Letter...' : 'Open Your Surprise ❤️'}
                  </button>
                  <span className="font-ui text-[10px] text-[#f7e7ce]/70 tracking-wider">
                    Tap the golden seal or button above
                  </span>
                </div>
              </div>
            )}

            {sceneIdx === 1 && (
              <div className="w-full flex-1 flex items-center justify-center py-2 animate-scene-enter">
                <div className="parchment-sheet pointer-events-auto relative w-full max-w-xl rounded-2xl p-5 sm:p-8 text-[#2b0510] my-auto">
                  <div className="flex items-center justify-between border-b border-[#b88924]/30 pb-2.5 mb-3">
                    <span className="font-ui text-[10px] uppercase tracking-[0.2em] text-[#7a1c36] font-semibold">
                      November 19 • Men’s Day Edition
                    </span>
                    <span className="w-6 h-6 rounded-full bg-gradient-to-br from-[#d4af37] to-[#8c6414] text-[#fff8e7] font-editorial font-bold text-xs flex items-center justify-center">
                      V
                    </span>
                  </div>

                  <div className="space-y-2.5 sm:space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                    {LOVE_LETTER_LINES.map((line, idx) => {
                      const isVisible = idx < letterVisibleLines;
                      const isGreeting = idx === 0;
                      return (
                        <p
                          key={idx}
                          className={`transition-all duration-500 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'} ${
                            isGreeting ? 'font-handwritten text-3xl sm:text-4xl text-[#7a1632] mb-1' : 'font-editorial text-base sm:text-xl leading-relaxed text-[#2b0510]/95'
                          }`}
                        >
                          {line}
                        </p>
                      );
                    })}
                  </div>

                  <div className={`mt-4 pt-3 border-t border-[#b88924]/30 flex flex-col xs:flex-row items-center justify-between gap-3 transition-all ${letterVisibleLines >= LOVE_LETTER_LINES.length ? 'opacity-100' : 'opacity-0'}`}>
                    <span className="font-handwritten text-2xl sm:text-3xl text-[#7a1632]">Forever & Always Yours ❤️</span>
                    <button onClick={handleNext} className="w-full xs:w-auto px-5 py-2 rounded-full bg-[#4a0e1e] text-[#f7e7ce] font-ui text-xs font-medium border border-[#d4af37]/60 shadow cursor-pointer">
                      Begin Story →
                    </button>
                  </div>
                </div>
              </div>
            )}

            {sceneIdx >= 2 && sceneIdx <= 10 && (
              <div key={currentScene.id} className="w-full flex-1 flex flex-col items-center justify-end pb-3 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto max-w-xl w-full rounded-2xl px-5 py-5 sm:px-8 sm:py-6 text-center relative">
                  <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#d4af37]/15 border border-[#d4af37]/35 mb-2">
                    <span className="font-ui text-[10px] uppercase tracking-[0.18em] text-[#f4c2c2]">{currentScene.badge}</span>
                  </div>
                  <blockquote className="font-editorial italic text-xl sm:text-3xl text-[#f7e7ce] leading-snug">
                    “{currentScene.quote}”
                  </blockquote>
                </div>
              </div>
            )}

            {sceneIdx === 11 && (
              <div className="w-full flex-1 flex flex-col items-center justify-end pb-3 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto max-w-xl w-full rounded-2xl px-5 py-5 text-center relative">
                  <div className="flex flex-wrap items-center justify-center gap-2 mb-2">
                    <span className="px-2.5 py-0.5 rounded-full bg-[#d4af37]/15 border border-[#d4af37]/35 font-ui text-[10px] uppercase text-[#f4c2c2]">{currentScene.badge}</span>
                    <span className="px-2.5 py-0.5 rounded-full bg-[#8b1538]/45 border border-[#ff8da1]/40 font-ui text-[10px] text-[#ffe4ec]">💓 Sent: {heartBeatCount}</span>
                  </div>
                  <p key={heartBeatCount} className="font-editorial italic text-lg sm:text-2xl text-[#f7e7ce] min-h-[3rem] flex items-center justify-center">
                    “{heartBeatCount === 0 ? 'Tap the button below to feel my heartbeat...' : HEARTBEAT_CUTE_MESSAGES[(heartBeatCount - 1) % HEARTBEAT_CUTE_MESSAGES.length]}”
                  </p>
                  <button onClick={handlePumpHeart} className="gold-cta-btn mt-3 px-6 py-3 rounded-full font-ui text-xs sm:text-sm font-bold text-[#1a050b] active:scale-95 cursor-pointer shadow">
                    💓 Send Heartbeat ❤️
                  </button>
                </div>
              </div>
            )}

            {sceneIdx === 12 && (
              <div className="w-full flex-1 flex flex-col items-center justify-end pb-3 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto max-w-xl w-full rounded-2xl px-5 py-6 text-center border-[#d4af37]/50">
                  <p className="font-ui text-[10px] uppercase tracking-[0.25em] text-[#ff8da1] mb-2">Today, Tomorrow & Always</p>
                  <h2 className="font-editorial text-3xl sm:text-5xl font-bold text-[#f7e7ce] mb-2">Happy Men's Day, Vivek ❤️</h2>
                  <p className="font-handwritten text-2xl sm:text-4xl text-[#f4c2c2] mb-5">In every lifetime, my heart chooses you.</p>
                  <div className="flex flex-wrap items-center justify-center gap-3">
                    <button onClick={handleNext} className="gold-cta-btn px-6 py-2.5 rounded-full font-ui text-xs sm:text-sm font-bold text-[#1a050b] cursor-pointer">Explore Universe ✨ →</button>
                    <button onClick={handleReplay} className="px-5 py-2.5 rounded-full font-ui text-xs border border-[#d4af37]/50 text-[#f7e7ce] cursor-pointer">Replay ↻</button>
                  </div>
                </div>
              </div>
            )}

            {sceneIdx === 13 && (
              <div className="w-full flex-1 flex flex-col items-center justify-center py-2 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto relative w-full max-w-2xl rounded-2xl overflow-hidden border-[#d4af37]/50">
                  <div className="relative w-full aspect-video max-h-[38vh] bg-[#12061c] overflow-hidden">
                    {customUniverseVideoUrl ? (
                      <video src={customUniverseVideoUrl} autoPlay loop muted playsInline className="w-full h-full object-cover" />
                    ) : (
                      <OurUniverseAnimatedScene isInfinity={universeInfinityMode} />
                    )}
                    <button onClick={() => universeVideoInputRef.current?.click()} className="absolute top-2 right-2 px-2.5 py-1 rounded-full bg-[#14040a]/80 border border-[#d4af37]/45 font-ui text-[10px] text-[#f7e7ce]">
                      {customUniverseVideoUrl ? 'Change Video' : 'Load MP4'}
                    </button>
                    <input ref={universeVideoInputRef} type="file" accept="video/*" onChange={handleUniverseVideoUpload} className="hidden" />
                  </div>
                  <div className="px-4 py-4 text-center bg-gradient-to-b from-[#1d0714]/90 to-[#0e040c]/95">
                    <blockquote className="font-editorial italic text-base sm:text-2xl text-[#f7e7ce] mb-3">
                      “If the universe gave me a thousand chances, I'd find my way to you in every single one.”
                    </blockquote>
                    <button onClick={() => setUniverseInfinityMode(prev => !prev)} className={`px-5 py-2 rounded-full font-ui text-xs font-bold transition cursor-pointer ${universeInfinityMode ? 'bg-[#ffd78a] text-[#1a050b]' : 'gold-cta-btn text-[#1a050b]'}`}>
                      Into infinity with you ❤️
                    </button>
                  </div>
                </div>
              </div>
            )}

            {sceneIdx === 14 && (
              <div className="w-full flex-1 flex flex-col items-center justify-center py-2 animate-scene-enter">
                <h2 className="font-editorial text-2xl sm:text-4xl font-semibold text-[#f7e7ce] mb-3 text-center">Little Things About <span className="italic text-[#ff8da1]">You</span></h2>
                <div className="pointer-events-auto grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl w-full px-1 max-h-[55vh] overflow-y-auto">
                  {LITTLE_THINGS_CARDS.map((text, idx) => (
                    <div key={idx} className={`glass-luxury rounded-2xl p-4 text-center transition-all ${idx < visibleLittleCards ? 'opacity-100' : 'opacity-0'}`}>
                      <p className="font-editorial italic text-lg sm:text-xl text-[#f7e7ce]">“{text}”</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {sceneIdx === 15 && (
              <div className="w-full flex-1 flex flex-col items-center justify-between py-2 animate-scene-enter">
                <h2 className="font-editorial text-2xl sm:text-4xl font-semibold text-[#f7e7ce] text-center mb-2">A few little promises ❤️</h2>
                {activePromiseModal && (
                  <div className="parchment-sheet pointer-events-auto max-w-md w-full rounded-2xl p-5 text-[#2b0510] text-center my-auto">
                    <span className="font-ui text-[10px] uppercase text-[#7a1632] font-bold">{activePromiseModal.label}</span>
                    <p className="font-editorial italic text-xl sm:text-2xl text-[#2b0510] my-3">“{activePromiseModal.text}”</p>
                    <button onClick={() => setActivePromiseModal(null)} className="px-5 py-1.5 rounded-full bg-[#4a0e1e] text-[#f7e7ce] font-ui text-xs">Close</button>
                  </div>
                )}
                <div className="pointer-events-auto w-full max-w-xl flex flex-wrap items-center justify-center gap-2.5 mb-2">
                  {JAR_PROMISE_NOTES.map((note) => (
                    <button key={note.id} onClick={() => handleOpenPromiseNote(note)} className={`px-4 py-2 rounded-full font-ui text-xs font-semibold cursor-pointer ${openedPromiseIds.includes(note.id) ? 'glass-luxury border-[#ff8da1] text-[#ffd78a]' : 'gold-cta-btn text-[#1a050b]'}`}>
                      {openedPromiseIds.includes(note.id) ? '💌' : '⭐'} {note.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {sceneIdx === 16 && (
              <div className="w-full flex-1 flex flex-col items-center justify-end pb-2 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto max-w-xl w-full rounded-2xl px-5 py-5 text-center border-[#d4af37]/55 max-h-[72vh] overflow-y-auto">
                  <div className="space-y-1.5 mb-3">
                    {ONE_LAST_THING_LINES.name || ONE_LAST_THING_LINES.map((line, idx) => (
                      <p key={idx} className={`font-editorial italic text-base sm:text-xl text-[#f7e7ce]/95 transition-opacity duration-500 ${idx < visibleLastLines ? 'opacity-100' : 'opacity-0'}`}>
                        {line}
                      </p>
                    ))}
                  </div>
                  <h2 className="font-editorial text-2xl sm:text-4xl font-bold text-[#ffd78a] mb-2">Happy Men's Day, Vivek ❤️</h2>
                  <p className="font-handwritten text-2xl sm:text-3xl text-[#ff9ec2] mb-4">Forever yours. ❤️</p>
                  <button onClick={handleReplay} className="gold-cta-btn px-6 py-3 rounded-full font-ui text-xs sm:text-sm font-bold text-[#1a050b] cursor-pointer shadow">
                    Replay Surprise ❤️
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION HUD */}
          <footer className="relative z-20 w-full px-3 pb-3 sm:pb-4 flex justify-center pointer-events-none">
            <nav aria-label="Storybook Navigation" className="glass-luxury pointer-events-auto px-3 py-2 rounded-full flex items-center gap-2 sm:gap-3">
              <button
                onClick={handlePrev}
                disabled={sceneIdx === 0}
                className="px-3 py-1.5 rounded-full font-ui text-xs text-[#f7e7ce] disabled:opacity-30 cursor-pointer"
              >
                ← Prev
              </button>

              <div className="flex items-center gap-1.5 px-1">
                {STORY_SCENES.map((s, idx) => (
                  <button
                    key={s.id}
                    onClick={() => {
                      if (idx > 0) setEnvelopeOpening(true);
                      else setEnvelopeOpening(false);
                      setSceneIdx(idx);
                    }}
                    title={s.label}
                    className={`transition-all rounded-full cursor-pointer ${idx === sceneIdx ? 'w-5 h-2 bg-[#d4af37]' : 'w-2 h-2 bg-[#f7e7ce]/30'}`}
                  />
                ))}
              </div>

              <button
                onClick={handleNext}
                disabled={sceneIdx === STORY_SCENES.length - 1}
                className="px-3 py-1.5 rounded-full font-ui text-xs text-[#f7e7ce] disabled:opacity-30 cursor-pointer"
              >
                {sceneIdx === 0 ? 'Open' : 'Next'} →
              </button>
            </nav>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
